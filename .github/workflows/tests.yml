name: SliceGPT packaging and CPU contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python build ruff
      - run: .venv/bin/ruff check packages/runtime packages/toolkit/src/slicegpt_toolkit tests scripts
      - run: .venv/bin/ruff format --check packages/runtime packages/toolkit/src/slicegpt_toolkit tests scripts
      - run: .venv/bin/python -m build packages/runtime --outdir dist
      - run: .venv/bin/python -m build packages/toolkit --outdir dist
      - run: uv venv .venv-clean
      - run: uv pip install --python .venv-clean/bin/python dist/vllm_hust_slicegpt-0.1.0a1-py3-none-any.whl 'vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@52e96021c8017938b133ddba895795a13f707568'
      - run: .venv-clean/bin/python scripts/check_wheel.py
      - run: uv pip uninstall --python .venv-clean/bin/python vllm-hust-slicegpt
      - run: .venv-clean/bin/python -c 'import importlib.util; assert importlib.util.find_spec("vllm_hust_slicegpt") is None'
  toolkit:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
      - run: uv pip install --python .venv/bin/python ./packages/runtime ./packages/toolkit pytest
      - run: .venv/bin/slicegpt-compress --help
      - run: .venv/bin/slicegpt-convert-llama --help
      - run: .venv/bin/slicegpt-convert-qwen2 --help
      - run: .venv/bin/python -m pytest -q
